<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | The Filament</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">The Filament</a>
      <nav class="nav">
        <a href="index.html#products">Shop</a>
        <a href="index.html#room-decor">Room Decor</a>
      </nav>
    </div>
  </header>

  <section class="auth-section">
    <div class="auth-card">
      <h2>Create an Account</h2>
      <p class="auth-subtitle">Join us for faster orders & exclusive offers</p>

      <form id="registerForm">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone (optional)</label>
        <input type="tel" id="phone" name="phone">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6">

        <button type="submit" class="btn btn-primary auth-btn">Register</button>

        <p id="formMessage" class="form-message"></p>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </section>

  <script src="auth.js"></script>
</body>
</html>
